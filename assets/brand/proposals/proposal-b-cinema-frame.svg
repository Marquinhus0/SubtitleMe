<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Proposta B — Split Cinema Frame">
  <defs>
    <linearGradient id="pb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111815" />
      <stop offset="100%" stop-color="#070B09" />
    </linearGradient>
    <linearGradient id="pb-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#pb-bg)" stroke="#1E2B25" stroke-width="8" />
  <!-- Cinema 16:9 viewport frame -->
  <rect x="76" y="124" width="360" height="264" rx="34" fill="#0B110E" stroke="url(#pb-frame)" stroke-width="18" />
  <!-- Top cinema cue accent -->
  <circle cx="128" cy="176" r="14" fill="#10B981" opacity="0.7" />
  <!-- Primary dialogue line -->
  <rect x="128" y="256" width="256" height="28" rx="14" fill="#EEF4F1" />
  <!-- Secondary translated dialogue line -->
  <rect x="156" y="306" width="200" height="28" rx="14" fill="#34D399" />
</svg>
